<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Schedule a Call</title>
</head>
<script>
window.addEventListener('message', function (event) {

  if (!event.data || event.data.source !== 'FA_FORM') return;

  if (event.data.type === 'REQUEST_PARENT_URL') {
    event.source.postMessage(
      {
        source: 'PARENT_PAGE',
        type: 'PARENT_URL',
        parentUrl: window.location.href
      },
      event.origin === 'null' ? '*' : event.origin
    );
  }

});
</script>
<body>

  <!-- Target container where the workflow will render -->
  <div id="fa-workflow"></div>

  <!-- Embed the workflow and target the container -->
  <script
    src="https://goosehead.tfaforms.net/publish/wf/wfnQNKl?ProspectId="
    data-qp-target-id="fa-workflow"
    defer>
  </script>

  <script>
  window.addEventListener('message', function(event) {
    if (event.data && event.data.source === 'FA_FORM') {
      console.log('📩 Message from Form:', event.data.message, event.data.data);
    }
  });
</script>
  
  <script>
  document.body.insertAdjacentHTML(
    'beforeend',
    '<p style="font-family:Arial; padding:12px; background:#fffae6; border:1px solid #f0d000;">Debug: index.html script ran ✅</p>'
  );
  alert('Debug: index.html script ran ✅');
  console.log('Debug: Current window URL:', window.location.href);
</script>

  <script>
(function () {
  const PREFIX = '[PARENT]';

  function log(...args) { console.log(PREFIX, ...args); }

  log('Parent page loaded:', window.location.href);

  window.addEventListener('message', function (event) {
    // Log everything coming in so we can see origin + payload
    log('Message received', { origin: event.origin, data: event.data });

    // Only handle messages we expect from the form
    if (!event.data || event.data.source !== 'FA_FORM') return;

    // If the form asks for the parent URL, respond
    if (event.data.type === 'REQUEST_PARENT_URL') {
      const targetOrigin = event.origin === 'null' ? '*' : event.origin;

      log('Replying with parent URL to form', { targetOrigin });

      event.source && event.source.postMessage(
        {
          source: 'PARENT_PAGE',
          type: 'PARENT_URL',
          parentUrl: window.location.href
        },
        targetOrigin
      );
    }

    // If the form reports ProspectId, log it clearly
    if (event.data.type === 'REPORT_PROSPECT') {
      log('Form reports ProspectId parsing result:', event.data);
    }
  });
})();
</script>
  
</body>
</html>
