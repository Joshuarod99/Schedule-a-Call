<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Schedule a Call</title>
</head>
<script>
window.addEventListener('message', function (event) {
  if (!event.data || event.data.source !== 'FA_FORM') return;

  if (event.data.type === 'REQUEST_PARENT_URL') {
    event.source.postMessage(
      {
        source: 'PARENT_PAGE',
        type: 'PARENT_URL',
        parentUrl: window.location.href
      },
      '*'
    );
  }
});
</script>
<body>

<div id="fa-workflow"></div>

<iframe
  src="https://goosehead.tfaforms.net/wfnQNKl?ProspectId=aDsPW0000032uVp0AI"
  width="100%"
  height="900"
  frameborder="0"
></iframe>
  
</body>
</html>
