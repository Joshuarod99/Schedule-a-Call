<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Schedule a Call</title>
</head>
<script>
window.addEventListener('message', function (event) {
  if (!event.data || event.data.source !== 'FA_FORM') return;

  if (event.data.type === 'REQUEST_PARENT_URL') {
    event.source.postMessage(
      {
        source: 'PARENT_PAGE',
        type: 'PARENT_URL',
        parentUrl: window.location.href
      },
      '*'
    );
  }
});
</script>
<body>

  <script>
  // Capture the ProspectId parameter from your page's URL
  const urlParams = new URLSearchParams(window.location.search);
  const prospectId = urlParams.get('ProspectId');
 
  // Build the workflow URL with the parameter
  let workflowUrl = 'https://goosehead.tfaforms.net/publish/wf/wfnQNKl';
  if (prospectId) {
    workflowUrl += '?ProspectId=' + encodeURIComponent(prospectId);
  }
 
  // Create and inject the script element
  const script = document.createElement('script');
  script.src = workflowUrl;
  script.setAttribute('data-qp-target-id', 'fa-workflow');
  document.currentScript.parentNode.insertBefore(script, document.currentScript);
</script>

  <div id="fa-workflow"></div>
  
</body>
</html>
