<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Schedule a Call</title>
</head>
<script>
window.addEventListener('message', function (event) {
  if (!event.data || event.data.source !== 'FA_FORM') return;

  if (event.data.type === 'REQUEST_PARENT_URL') {
    event.source.postMessage(
      {
        source: 'PARENT_PAGE',
        type: 'PARENT_URL',
        parentUrl: window.location.href
      },
      '*'
    );
  }
});
</script>
<body>

  <!-- Target container where the workflow will render -->
  <div id="fa-workflow"></div>

  <!-- Embed the workflow and target the container -->
  <script
    src="https://goosehead.tfaforms.net/publish/wf/wfnQNKl?ProspectId="
    data-qp-target-id="fa-workflow"
    defer>
  </script>
  
</body>
</html>
