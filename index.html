<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Schedule a Call</title>
</head>
<body>

<div id="fa-embed"></div>

<script>
(function () {

  // Read ProspectId from the current page URL
  const params = new URLSearchParams(window.location.search);
  const prospectId = params.get("ProspectId");

  // Build the FormAssembly workflow URL
  const base = "https://goosehead.tfaforms.net/wfnQNKl";
  const faUrl = prospectId
    ? `${base}?ProspectId=${encodeURIComponent(prospectId)}`
    : base;

  // Create and insert the iframe
  const iframe = document.createElement("iframe");
  iframe.src = faUrl;
  iframe.width = "100%";
  iframe.height = "900";
  iframe.frameBorder = "0";
  iframe.setAttribute("title", "FormAssembly Workflow");
  iframe.setAttribute("loading", "lazy");

  document.getElementById("fa-embed").appendChild(iframe);

})();
</script>

</body>
</html>
